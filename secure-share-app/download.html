<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VaultDrop Download</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="backdrop"></div>
  <div class="shell narrow-shell">
    <header class="hero compact">
      <div>
        <p class="eyebrow">Recipient View</p>
        <h1>Decrypt Shared File</h1>
      </div>
      <p class="hero-copy">
        Enter the passphrase you received separately. Decryption happens in your browser.
      </p>
    </header>

    <main class="grid single">
      <section class="panel">
        <p class="section-kicker">Retrieve Share</p>
        <h2>Download and Decrypt</h2>
        <form id="decrypt-form">
          <label class="field">
            <span>Share token</span>
            <input id="token-input" type="text" placeholder="Paste token or open a share link" required>
          </label>
          <label class="field">
            <span>Passphrase</span>
            <input id="passphrase-input" type="password" placeholder="Enter passphrase" required>
          </label>
          <button type="submit" id="decrypt-button">Decrypt File</button>
        </form>

        <section id="download-result" class="result hidden" aria-live="polite">
          <h3>File Ready</h3>
          <p id="download-meta"></p>
          <button id="save-button" type="button">Save Decrypted File</button>
        </section>

        <p id="status-text" class="status-text"></p>
      </section>
    </main>
  </div>

  <script src="download.js"></script>
</body>
</html>
